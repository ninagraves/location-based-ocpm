[project]
name = "ocelescope-instance"
version = "0.1.0"
description = "An Ocelescope instance: the published backend host plus local modules"
requires-python = ">=3.11"
# `pnpm run add:backend` adds local backend modules here.
dependencies = [
  "ocelescope-backend>=0.10.2",
  "ocelescope-module-location-based-ocpm",
  "ocelescope-module-ocel>=0.10.2",
  # ocelescope 0.10.2 uses the lambda syntax that DuckDB 2 rejects; remove once ocelescope supports DuckDB 2.
  "duckdb>=1.5.4,<2",
]

[tool.uv.workspace]
members = ["backend-modules/*"]

[tool.uv.sources]
ocelescope-module-location-based-ocpm = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["backend-modules/location-ocpm/tests"]
pythonpath = ["backend-modules/location-ocpm/tests"]
